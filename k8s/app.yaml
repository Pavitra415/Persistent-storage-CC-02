
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dashboard-sa
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dashboard-pod-manager
  namespace: default
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dashboard-pod-manager-binding
  namespace: default
subjects:
  - kind: ServiceAccount
    name: dashboard-sa
    namespace: default
roleRef:
  kind: Role
  name: dashboard-pod-manager
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: persistent-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: persistent-dashboard
  template:
    metadata:
      labels:
        app: persistent-dashboard
    spec:
      serviceAccountName: dashboard-sa
      containers:
        - name: dashboard
          image: persistent-dashboard:v3
          imagePullPolicy: IfNotPresent
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            - name: DATA_DIR
              value: /data
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          volumeMounts:
            - name: persistent-storage
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: persistent-storage
          persistentVolumeClaim:
            claimName: persistent-dashboard-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: persistent-dashboard
spec:
  type: ClusterIP
  selector:
    app: persistent-dashboard
  ports:
    - port: 80
      targetPort: 5000
